databases:
  - name: themis-db
    databaseName: themis
    user: themis
    plan: free

services:
  - type: web
    name: themis-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -U pip && pip install .
    startCommand: set -e && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themis-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /healthz

  - type: web
    name: themis-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
